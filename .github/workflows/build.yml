name: build

on:
  workflow_dispatch:
    inputs:
      ngsolve_version:
        description: NGSolve version (empty builds the current checkout)
        type: string
      dry_run:
        description: Build and test without uploading to PyPI
        type: boolean
        default: true
      level:
        description: 'build level'
        required: true
        default: 'full'
        type: choice
        options:
          - test_only
          - quick
          - full
  push:
    branches: [main, main-dev]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.ngsolve_version != ''
        with:
          fetch-depth: 0
      - uses: PaulSt/ngsolve-release-watcher@main
        id: release
        with:
          ngsolve_version: ${{ inputs.ngsolve_version }}
          dry_run: ${{ inputs.dry_run }}
      - uses: actions/upload-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
          path: pyproject.toml

  check_formatting:
    name: Check Formatting with Clang Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: "NGSTrefftz"
          fetch-depth: 0
      - uses: RafikFarhad/clang-format-github-action@v4
        with:
          sources: "src/**/*.hpp,src/**/*.cpp,test/**/*.cpp"
          style: file

  test_linux:
    name: Test on Linux
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: setup
        run: pacman -Syu --noconfirm && pacman -S --noconfirm python python-pip python-setuptools git gcc make cmake
      - uses: actions/checkout@v6
        with:
          path: "NGSTrefftz"
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
          path: NGSTrefftz
      - name: install ngstrefftz
        run: |
          python3 -m pip install --break-system-packages numpy scipy matplotlib
          cd NGSTrefftz && python3 -m pip install --break-system-packages . -v
      - name: run test
        run: cd $GITHUB_WORKSPACE/NGSTrefftz/test && python3 -m doctest -v *.py

  gtest_linux:
    name: Test GTest on Linux
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: "NGSTrefftz"
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
          path: NGSTrefftz
      - uses: Bacondish2023/setup-googletest@v1
        with:
          tag: v1.15.2
      # setup-googletest selects Python 3.x internally; restore our pinned version.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install ngsolve
        run: |
          cd NGSTrefftz
          pip install tomli numpy scipy matplotlib
          python3 <<'PY'
          import tomllib, pathlib, subprocess, sys
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          subprocess.check_call(["pip", "install", *deps])
          PY
      - name: get ngsolve blas
        id: ngsolve_blas
        run: |
          NGSOLVE_BLAS_LINK_DIR="$RUNNER_TEMP/ngsolve-openblas-link"
          mkdir -p "$NGSOLVE_BLAS_LINK_DIR"
          python3 - "$NGSOLVE_BLAS_LINK_DIR" <<'PY'
          import sys
          from pathlib import Path

          import ngsolve_openblas

          sonames = {
              "libopenblas": "libopenblas.so.0",
              "libgfortran": "libgfortran.so.5",
          }
          link_dir = Path(sys.argv[1])
          for library in map(Path, ngsolve_openblas.get_libraries()):
              for prefix, soname in sonames.items():
                  if library.name.startswith(prefix):
                      link = link_dir / soname
                      link.unlink(missing_ok=True)
                      link.symlink_to(library)
          PY
          echo "link_dir=$NGSOLVE_BLAS_LINK_DIR" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE/NGSTrefftz" \
            -B "$GITHUB_WORKSPACE/NGSTrefftz/make" \
            -DNGSTREFFTZ_USE_GTEST=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,${{ steps.ngsolve_blas.outputs.link_dir }}" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/NGSTrefftz/make"
      - name: Run tests
        run: |
          NGSOLVE_BLAS_LIBS="$(python - <<'PY'
          import ngsolve_openblas
          print(":".join(str(p) for p in ngsolve_openblas.get_libraries()))
          PY
          )"

          echo "Preloading NGSolve BLAS libraries:"
          echo "${NGSOLVE_BLAS_LIBS}"

          LD_PRELOAD="${NGSOLVE_BLAS_LIBS}${LD_PRELOAD:+:${LD_PRELOAD}}" \
            ctest \
              --test-dir "$GITHUB_WORKSPACE/NGSTrefftz/make" \
              --output-on-failure

  build_wheels:
    if: ${{ inputs.level != 'test_only' }}
    name: Build wheels on ${{ matrix.os }}
    needs: [prepare, test_linux, gtest_linux]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-15-intel
            doit: ${{ inputs.level != 'quick' }}
            cibw_build: cp310-* cp311-* cp312-* cp313-* cp314-*

          - os: ubuntu-latest
            doit: ${{ inputs.level != 'quick' }}
            cibw_build: cp310-* cp311-* cp312-* cp313-* cp314-*

          - os: ubuntu-latest
            doit: ${{ inputs.level == 'quick' }}
            cibw_build: cp313-*

          - os: windows-2022
            doit: ${{ inputs.level != 'quick' }}
            cibw_build: cp311-* cp312-* cp313-* cp314-*

    env:
      CIBW_BUILD: ${{ matrix.cibw_build }}
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_ENVIRONMENT_WINDOWS: >
        CMAKE_GENERATOR='Visual Studio 17 2022'
        CMAKE_GENERATOR_PLATFORM=x64

    steps:
      - uses: actions/checkout@v6
        if: ${{ matrix.doit }}
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: ${{ matrix.doit && inputs.ngsolve_version != '' }}
        with:
          name: release-pyproject
      - name: Free disk space for Linux wheel build
        if: ${{ matrix.doit && matrix.os == 'ubuntu-latest' }}
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h
      - if: ${{ matrix.doit }}
        uses: pypa/cibuildwheel@v3.2.1
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NGSTREFFTZ: ${{ needs.prepare.outputs.version }}
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NGSTREFFTZ
          CIBW_BUILD_VERBOSITY: 1
      - if: ${{ matrix.doit }}
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    if: ${{ inputs.level != 'quick' }}
    needs: [prepare, test_linux, gtest_linux]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
      - name: Build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NGSTREFFTZ: ${{ needs.prepare.outputs.version }}
        run: uv tool run --python 3.13 --from build pyproject-build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    if: ${{ !inputs.dry_run && needs.prepare.outputs.published != 'true' }}
    needs: [prepare, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.ref == 'refs/heads/main' || github.event_name == 'release' || inputs.ngsolve_version != ''
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.ref == 'refs/heads/main-dev' && inputs.ngsolve_version == ''
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  docker:
    if: inputs.ngsolve_version == ''
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: paulstdocker/ngstrefftz
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: github.event_name == 'release' && github.event.action == 'created'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'release' && github.event.action == 'created' }}
          tags: ${{ steps.meta.outputs.tags }}

  docs:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    container: python:3.13
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: "NGSTrefftz"
      - name: pip install requirements
        run: |
          apt update -y && DEBIAN_FRONTEND="noninteractive" apt install -y build-essential git pandoc
          pip install -r $GITHUB_WORKSPACE/NGSTrefftz/docs/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: cibw-wheels-ubuntu*
          path: wheels
          merge-multiple: true
      - name: install ngstrefftz
        run: pip install $GITHUB_WORKSPACE/wheels/*-cp313-cp313-manylinux_2_28_x86_64.manylinux2014_x86_64.whl
      - name: Build Sphinx HTML
        run: sphinx-build -b html $GITHUB_WORKSPACE/NGSTrefftz/docs $GITHUB_WORKSPACE/NGSTrefftz/docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/NGSTrefftz/docs/_build/html

  deploy-docs:
    needs: docs
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  paper:
    runs-on: ubuntu-latest
    if: ${{ inputs.level == 'full' }}
    name: Paper Draft
    steps:
      - uses: actions/checkout@v6
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: docs/paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: joss_paper
          path: docs/paper/paper.pdf

name: build

on:
  workflow_dispatch:
    inputs:
      ngsolve_version:
        description: NGSolve version (empty builds the current checkout)
        type: string
      dry_run:
        description: Build and test without uploading to PyPI
        type: boolean
        default: true
      level:
        description: 'build level'
        required: true
        default: 'full'
        type: choice
        options:
          - quick
          - full
  push:
    branches: [main, main-dev]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.ngsolve_version != ''
        with:
          fetch-depth: 0
      - uses: PaulSt/ngsolve-release-watcher@main
        id: release
        with:
          ngsolve_version: ${{ inputs.ngsolve_version }}
          dry_run: ${{ inputs.dry_run }}
      - uses: actions/upload-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
          path: pyproject.toml

  check_formatting:
    name: Check Formatting with Clang Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: "NGSTrefftz"
          fetch-depth: 0
      - uses: RafikFarhad/clang-format-github-action@v4
        with:
          sources: "src/**/*.hpp,src/**/*.cpp,test/**/*.cpp"
          style: file

  test_linux:
    name: Test on Linux
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
      - name: Build and test
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libopenblas0-pthread
          python -m pip install . numpy scipy matplotlib
          cmake -S . -B build -DNGSTREFFTZ_USE_GTEST=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [prepare, test_linux]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel, ubuntu-latest, windows-2022]
    env:
      CIBW_BUILD: ${{ inputs.level == 'quick' && 'cp314-*' || 'cp310-* cp311-* cp312-* cp313-* cp314-*' }}
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_ENVIRONMENT_WINDOWS: >
        CMAKE_GENERATOR='Visual Studio 17 2022'
        CMAKE_GENERATOR_PLATFORM=x64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
      - name: Free disk space for Linux wheel build
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h
      - uses: pypa/cibuildwheel@v3.2.1
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NGSTREFFTZ: ${{ needs.prepare.outputs.version }}
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NGSTREFFTZ
          CIBW_BUILD_VERBOSITY: 1
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    if: ${{ inputs.level != 'quick' }}
    needs: [prepare, test_linux]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: inputs.ngsolve_version != ''
        with:
          name: release-pyproject
      - name: Build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NGSTREFFTZ: ${{ needs.prepare.outputs.version }}
        run: uv tool run --python 3.14 --from build pyproject-build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    if: ${{ !inputs.dry_run && needs.prepare.outputs.published != 'true' }}
    needs: [prepare, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.ref == 'refs/heads/main' || github.event_name == 'release' || inputs.ngsolve_version != ''
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.ref == 'refs/heads/main-dev' && inputs.ngsolve_version == ''
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  docker:
    if: inputs.ngsolve_version == ''
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: paulstdocker/ngstrefftz
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: github.event_name == 'release' && github.event.action == 'published'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'release' && github.event.action == 'published' }}
          tags: ${{ steps.meta.outputs.tags }}

  docs:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: "NGSTrefftz"
      - uses: actions/download-artifact@v7
        with:
          name: cibw-wheels-ubuntu-latest
          path: wheels
      - name: Install wheel and documentation dependencies
        run: |
          apt update -y && DEBIAN_FRONTEND="noninteractive" apt install -y build-essential git pandoc
          python -m pip install "$GITHUB_WORKSPACE"/wheels/*-cp314-cp314-*.whl -r "$GITHUB_WORKSPACE/NGSTrefftz/docs/requirements.txt"
      - name: Build Sphinx HTML
        run: sphinx-build -b html $GITHUB_WORKSPACE/NGSTrefftz/docs $GITHUB_WORKSPACE/NGSTrefftz/docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/NGSTrefftz/docs/_build/html

  deploy-docs:
    needs: docs
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  paper:
    runs-on: ubuntu-latest
    if: ${{ inputs.level != 'quick' }}
    name: Paper Draft
    steps:
      - uses: actions/checkout@v6
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: docs/paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: joss_paper
          path: docs/paper/paper.pdf
